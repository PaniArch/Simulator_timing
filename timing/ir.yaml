  - cache::REQ_XBAR_BUF/MEM_REQ_BUF_ENABLE/CORE_RSP_BUF_ENABLE
  - cache-wrap::g_bypass
  statement: Bank input priority is init, eligible replay, eligible fill, flush, core request. Core ready requires
    grant, !mreq_queue_alm_full, !mshr_alm_full, !pipe_stall and no request-defer. With AMO disabled and single-sector
    lines, amo_chain_stall and wb_hold are zero; crsp_queue_valid&&!crsp_queue_ready still stalls. Fill waits for
    grant, no forward pending/inflight and (writeback case) MREQ space. Bank-selection xbar is R with REQ_XBAR_BUF=0
    for both frozen L1s; bank responses and memory outputs have their own buffering/arbiter. D-cache NC bypass is
    a separate route; L2/L3 DIRECT_PASSTHRU removes actual wrapper output buffers and bank storage for this frozen
    width/port match.
- id: r-simt-barrier-detail
  status: FROZEN
  nodes:
  - n-sfu
  - n-schedule
  - n-simt
  - n-barrier
  evidence:
