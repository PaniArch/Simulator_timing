  statement: Timing wait resources retain identity and remaining lane coverage without assigning a memory delay.
    Provider holds response valid and payload until downstream accepts; pool adds no response register.
    Responses match old ID/epoch/warp/uop context; unknown, duplicate coverage and old epoch reject before
    mutation. Fetch additionally requires whole response coverage and permits one context per warp. STD FPU
    header contexts also require whole response coverage, without the per-warp restriction. Full pool
    does not borrow a same-edge released entry. Flush discards local context only; provider cancellation and
    memory visibility remain u-memory/u-visibility, not inferred from tag release.
- id: r-software-effect-delivery-foundation
  status: PROVISIONAL
  nodes:
  - n-operands
  - n-commit
  - n-sfu
  - n-fpu
  evidence:
  - functional-operands::OperandCapture.Read/EvaluateAt
  - functional-delivery::EffectDelivery.Deliver
  - functional::sections 2/4/5/10/11 state owner and stale transaction contract
  statement: The execution-effects foundation captures source positions independently at operand-read events,
    retaining detached PC/mask and copied external context. EvaluateAt can obtain CSR/FRM/control context at
    a separately selected execution event while retaining source values. Existing ISA Decode and the shared
    snapshot evaluator dispatch remain the sole semantic implementation. EffectDelivery retains copied effects
    and receipts, never a delayed whole-Warp candidate. Explicit WB lane subsets, control/trap, CSR, FFLAGS,
    memory/ordering and fault groups each stage against the live canonical owner immediately before synchronous
    commit. Trap CSR writes remain with trap/control validation. Forwarded groups require the existing
    all-or-error external-owner callback; failure records no receipt, and successful duplicate delivery is
    rejected. Legacy EffectStage stale checks are unchanged. These are owner-side APIs only; wiring actual
    cycle observations, residency epochs, memory completion and packed byte visibility remains pending, so
    u-visibility is not fully resolved by this foundation; T11 request-window behavior is closed in audit-csr-stall.
- id: r-software-nonmemory-visibility
  status: PROVISIONAL
  nodes:
  - n-operands
  - n-alu
  - n-sfu
  - n-fpu
  - n-simt
  - n-commit
  evidence:
  - cycle-effects::Adapter.Begin/Observe/Reset
  - cycle-core::CoreReport.Executed/CSRRequest
  - functional-operands::OperandCapture.Read/EvaluateAt
  - functional-delivery::EffectDelivery.Deliver
  - integer::alu_hdr_in WGATHER mask and branch_reg
  - csr::csr_req_valid/ready
  - simt::OUT_REG
  - fpu::fpu_csr_reg
  statement: The initial functional binding admits one non-memory instruction with explicit epoch and increasing
    instruction ID; architectural faults return the original typed stop interface without guessed trap writes. Memory extends this profile
    under r-software-memory-visibility. Reports carry
    actual ALU/FPU admission, LSU slice and SFU PE acceptance identities; dispatch queue admission is not confused
    with PE execution. Adapter validates every report identity before owner effects, captures RF-read positions
    and evaluates through the existing snapshot dispatch at execution acceptance using old-edge owner context.
    CSR writes occur on every valid CSR request window, including result backpressure. Held windows re-evaluate old-edge CSR values with latched RF operands and deliver only CSREvent; final acceptance creates the single writeback receipt. FFLAGS/CSR uses one old-image transaction, preserving old CSR reads and software-field priority with joint receipts. Trap feedback samples scheduler CSR state on its delivery edge and jointly commits with software CSR, giving hardware trap writes final priority. Full-width non-memory WB uses the evaluator register-write mask,
    including WGATHER inactive non-source lanes; transient token mask remains packet identity, not a replacement
    semantic write mask. Branch/trap and WCTL effects use registered control observations, with JOIN adding the
    b-simt-feedback OUT_REG edge. FFLAGS use the registered FPU notification. Sequential PC is a conservative
    single-active-instruction model update at registered pending release, not an RTL scheduler PC timing claim.
    Successful effects are never replayed; errors require reset, which invalidates old epoch context without
    architectural rollback. The caller also flushes the timing core and cancels services. External control groups
    require the existing all-or-error owner callback; spawn uses the original atomic source/target transaction,
    and u-visibility is still unresolved outside the tested profiles.
- id: r-software-memory-visibility
  status: PROVISIONAL
  nodes:
  - n-lsu
  - n-commit
  evidence:
  - cycle-effects::Adapter.Service/observeMemory/observePacked
  - functional-delivery::EffectDelivery.Deliver
  statement: Single-active memory binding requires an explicit original byte owner and caller-scheduled service
    strictly after scheduler-port request acceptance. No default cache latency is inferred. Loads sample bytes
    at service and hold identity-tagged responses until accepted; disjoint lane fragments update registers only
    at matching WB. Packed completion shares original validation and assembly, with an optional byte mask
    merged into live owner state per element; zero byte mask retains legacy whole-word semantics. Stores use
    the original single Write or atomic WriteBatch once at service, even when LSU completion occurred earlier.
    Sequential PC waits for pending release and all services. Tests cover ordinary loads/stores and reverse-uop
    packed byte/half loads with split lane responses. Read-service faults pass through original completion to warp.Fault with lane metadata and cause; the failed
    fragment has no response or mutation and stops the adapter, without rolling back earlier visible fragments.
    Fence tests deliver ordering once at explicit service; single-participant barrier tests use original
    BarrierCoordinator Stage/Commit at registered feedback. ControlAllowed holds WSYNC/BAR before execution while old-edge drain context is pending. WSPAWN binds
    explicit target owners; the concurrent path retains a committed spawn until registered single-active permits activation, without software effect drain. Activation initializes from live target images with monotonic instruction frontiers for late ordinary PC receipts; legacy standalone StageWarpSpawn retains pre-issue snapshot checks. Residency and CTA membership remain caller-owned.
    Same-core Akita mixed instruction tests compare original functional owners after each drained instruction.
    Full scheduling remains outside this profile; u-memory and u-visibility remain unresolved outside it.
- id: r-software-program-runner
  status: PROVISIONAL
  nodes:
  - n-fetch
  - n-lsu
  - n-commit
  evidence:
  - cycle-effects::Adapter.Begin/Observe/Service/Reset
  statement: The initial program runner uses one active instruction and waits for all uop pending notifications,
    all internal resources and explicit external services to drain before reading canonical next PC/mask.
    Instruction words are read from the original byte owner at an explicitly delayed fetch service, not at
    instruction issue. Fetch and memory delays and Akita period are positive caller model choices, not RTL
    frequency or cache latency claims. Budget exhaustion preserves state; flush cancels queued services and
    increments epoch without rollback of visible effects. Raw program entry is initially limited to one
    source warp; spawn residency requires the separate effects binding and is rejected by this runner.
    Component Residents snapshots expose every stored token with local position, remaining arithmetic stages
    and readiness condition. Post-edge enter/stay/advance/leave records are deterministic and distinguish resource
    aliases; old-edge CoreReport and explicit service due times remain separate. Flush cancellation records
    retain the invalidated epoch. Tests cover closed residence histories, 33-cycle divider residency and a
    full four-entry packed request queue under backpressure followed by exactly one WB per uop. Increased
    service delay changes run duration without changing functional results. External time and visibility
    unknowns remain unresolved.
