  - schedule::bar_unit/split_join.OUT_REG
  - barrier::read_addr/store_waddr/is_rdw_hazard/unlock_valid_r
  statement: WCTL execute-fire/eop drives registered TMC/spawn/split/join/BAR/WSYNC. BAR requires LSU drained, WSYNC
    pending_alm_empty. Barrier read_addr is provided one cycle before req_valid; state RAM output is registered,
    phase read has explicit same-address forwarding, unlock is registered then consumed by scheduler. Local release
    occurs on participant completion with zero events, final event completion, or phase mismatch wait, according
