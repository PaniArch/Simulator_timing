  statement: Bank select is low word-address bits; P request arbitration and registered output precede one single-port
    SRAM per bank. A bank accepts at most one read or write per edge. Read requires response-buffer space; write
    needs no response. With DMA disabled, ready=(bank_rsp_ready||write)&&!is_rdw_hazard. A read matching last-cycle
    written address is delayed by the explicit hazard. SRAM output and tag pipe align; response xbar carries data
    safely under stall.
- id: r-cache-queues
  status: FROZEN
  nodes:
