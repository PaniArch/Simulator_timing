  - n-dcache
  evidence:
  - cache-bank::MREQ_QUEUE_SIZE/CRSQ_QUEUE_SIZE/mshr_pending_size
  - cache::mem_rsp_queue/cache_bank
  statement: MREQ depth=next_pow2(max(2*LATENCY,WRITEBACK?MSHR_SIZE:0)+MREQ_SIZE), almost-full at depth-LATENCY.
    CRSQ depth=next_pow2(2+CRSQ_SIZE). MRSQ is per external memory port in VX_cache; bank ignores that knob. MSHR_SIZE
    applies per bank unchanged; mshr_alm_full is wired to pending_size.full (not its alm_full). Accepted core requests
    temporarily reserve even before hit/miss finalize, releases count finalize plus replay/forward drain.
- id: r-cache-service
  status: FROZEN
  nodes:
  - n-icache
  - n-dcache
  - n-memory-fabric
  evidence:
