audit:
- id: audit-csr-stall
  status: RESOLVED
  original_question: What happens when CSR requests remain valid under backpressure, including simultaneous FFLAGS and trap feedback?
  decision: Every request window samples old CSR data and applies that edge's software write. Result acceptance alone creates the final WB receipt. Joint owner transactions accumulate FFLAGS before software field writes, then give trap entry MEPC/MCAUSE/MTVAL priority. Trap targets and return masks sample scheduler CSR state at feedback.
  evidence: [csr::csr_req_valid/write_enable/cta_read_wait_r, csr-data::fcsr_n, schedule::branch handling and trap CSR write order, csr-joint-delivery::deliverCSRJoint, trap-feedback-regression::TestHeldCSRReReadsHardwareTrapWriteOnNextEdge]
  validation: Held result-buffer and adapter tests; FFLAGS/FRM/FCSR/read-only priority; prior-edge versus same-edge MTVEC/MEPC writes; BAR plus FFLAGS plus CSR plus trap; scheduled four-warp trap round trip.
  closure_task: T11/cycle-control
- id: audit-t11-control
  status: RESOLVED
  original_question: Can normal explicit-owner multiwarp control paths progress without software receipt drain or unsupported-overlap errors?
  decision: Registered issue/EOP accounting gates WSYNC; LSU request/tag state gates BAR; WSPAWN commits before its registered single-active activation gate. Scheduler feedback follows per-field RTL order, and BAR.arrive can overlap a younger branch. Monotonic target activation frontiers retain old register/service tails without rewinding new PC. Duplicate identities and pairs forbidden by decode wstall remain errors.
  evidence: [hardware-accounting::instructionAccounting, spawn-wait-regression::TestMultiRunnerSpawnWaitAndOutstandingServiceTails, csr-joint-delivery::DeliverWarpSpawnAtActivation, schedule::always_comb, decode::is_wstall]
  validation: Model/effects/runner regressions for pending versus software receipts, packed commits, CSR values, overlap, memory backpressure, store tails, barrier release and spawn wait/reuse; verify-timing.sh and verify-offline.sh.
  closure_task: T11/cycle-control
  timing_implication: Closes normal paths in the current single-core explicit-owner profile; no complete RTL equivalence proof or Kernel dispatcher implementation is claimed.
- id: audit-functional
  status: RESOLVED
  evidence:
  - functional::section 11; U-SCHED-01 T5/03
  original_question: How does the functional model deterministically advance non-conflicting multiple warps?
  decision: Functional round-robin and serial Warp.Step, only for the non-conflicting functional subrange.
  validation: emu/core/run_test.go; scripts/verify-emu.sh as recorded by the existing contract.
  closure_task: T5/03-core-run-trace-contract
  timing_implication: None; hardware fetch priority and issue arbitration are separately sourced. Original U-SCHED-01
    conflicting memory ordering remains open.
- id: audit-timing-rules-partial
  status: RESOLVED
  original_question: Baseline u-execution/u-memory/u-feedback lacked inner queue derivations and local timing boundaries.
  decision: Close only documented RV32/conditional STD local latency, L1 queue derivation, local memory and local
    source-priority subranges; remaining unknowns retained.
  evidence:
  - cache-bank::MREQ_QUEUE_SIZE/CRSQ_QUEUE_SIZE
  - serial-div::cntr
  - serializer::shift_reg
  - cache-bypass::DIRECT_PASSTHRU
  - schedule::next-state assignments
  validation: Source tracing and static YAML/reference checks in timing-rules; no RTL simulation or whole-system
    cycle equivalence claimed.
  closure_task: T8/timing-rules
measurement_convention:
  status: PROVISIONAL
  condition: All measurements use cfg-baseline unless a stricter backend/path condition is stated; no reset during
    interval.
  transfer_edges: 'Input fire at E[k]; output transfer means first legal downstream sampling edge E[k+L]. A single
    register has L=1: its output settles after E[k], and the receiver samples at E[k+1].'
  enable_steps: Pipeline depth counts enabled shifts including input capture; stalled wall-clock cycles do not advance
    it.
  capacity: Entries resident between start allocation/push and end release/pop; start/end are lifecycle events,
    not a latency interval.
  static_configuration: Configuration widths/counts/RTL knobs are static elaboration properties, not time measurements;
    config and resource units apply.
  interval: Minimum distance between two input acceptance edges, under the explicit isolated/uncontended condition.
    Not steady-state whole-core throughput.
  visibility: A sideband receiver update is distinct from producer result availability and architectural effect
    commitment.
