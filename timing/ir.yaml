rules:
- id: r-transfer
  status: FROZEN
  nodes:
  - n-schedule
  - n-fetch
  - n-decode
  - n-dispatch
  - n-commit
  evidence:
  - elastic::valid_in/ready_in
  - commit::writeback_if
  statement: Valid-ready channels transfer at valid AND ready. Ack-free WB and sidebands have no invented ready.
    Elastic payload is retained under stall; combinational passthrough has no storage.
- id: r-schedule
  status: FROZEN
  nodes:
  - n-schedule
  - n-fetch
  evidence:
  - schedule::schedule_fire/ready_warps/preferred_warps/all_ibuf_full/wid_select
  - priority::REVERSE
  statement: Select lowest eligible wid using priority encoder. Active AND not stalled feeds ready_warps. With L1
    enabled, all_ibuf_full chooses ready_warps, otherwise preferred_warps excludes ibuf_full. Internal schedule_fire
    consumes output-buffer input; this is distinct from schedule_if fire and cache bus request fire.
- id: r-decode-feedback
  status: FROZEN
  nodes:
  - n-decode
  - n-schedule
  evidence:
  - decode::fetch_fire/decode_sched_valid_r/decode_sched_unlock_r
  - schedule::decode_sched_if
  statement: Decode feedback valid follows fetch acceptance through a register; unlock is not is_wstall. With C
    disabled, PC+4 is assigned on schedule_if_fire (scheduler output accepted by fetch), not internal schedule_fire
    and not functional Step commit.
- id: r-packed
  status: FROZEN
  nodes:
  - n-ibuffer
  - n-uop
  - n-lsu
  - n-commit
  evidence:
  - pkg::UOP_MAX
  - ibuffer::g_uop
  - uop::uop_start/uop_next
  - packld::uop_count/bytesel/op_args.lsu.offset
  statement: UOP_MAX=1 enables pack-load sequencer. PACKLB produces four uops and PACKLH two; offset and bytesel
    identify elements. Ordinary instructions pass through; active burst advances only when output accepted. Physical
    uop completion is distinct from atomic functional packed-load completion.
- id: r-scoreboard
  status: FROZEN
  nodes:
  - n-scoreboard
  - n-dispatch
  - n-commit
  evidence:
  - scoreboard::wb_inuse_regs/inuse_regs_n/operands_ready_r/out_arb/fu_pending
  - dispatch::fu_release
  statement: WB eop releases destination and wr_xregs first, staging OUTPUT acceptance then reserves destination and wr_xregs (not ibuffer-to-staging input).
    Readiness uses dependency masks including rd and special registers, is registered, and is suppressed by FU going-full/lock.
    Four-request sticky R arbitration selects eligible staging; credits return on dispatch acceptance, not execution
    completion.
- id: r-operands
  status: FROZEN
  nodes:
  - n-operands
  evidence:
  - opc::req_bank_idx/req_xbar/opd_fetched_st1/pipe_reg1/pipe_reg2/gpr_ram
  statement: Three source requests arbitrate per bank with P selection; used sources not yet fetched remain pending
    on collisions. Register zero is suppressed. RAM read output and metadata are aligned; collection can take multiple
    accept opportunities.
- id: r-commit
  status: FROZEN
  nodes:
  - n-commit
  - n-scoreboard
  - n-operands
  - n-schedule
  evidence:
  - commit::commit_arb/committed_warps/committed_warp_mask_r/writeback_if
  - pkg::EX_ALU/EX_LSU/EX_SFU/EX_FPU
  statement: One P arbiter merges the four execution-class result ports into a registered output; downstream ready
    is tied high. WB remains valid even when wb=false; operands gate register writes by wb. eop qualifies scheduler
    committed mask and scoreboard release. Byte-select shifts data and generates per-lane byte enables. No reorder
    buffer is instantiated.
- id: r-lsu-drain
  status: FROZEN
  nodes:
  - n-lsu-scheduler
  - n-lmem-switch
  - n-coalescer
  - n-sfu
  evidence:
  - lsu-scheduler::empty
  - mem-scheduler::req_queue_empty/ibuf_push/ibuf_pop
  - core::lsu_sched_drained/busy
  - mem::empty
  - wctl::bar_drain/wsync_drain
  statement: LSU empty is req_queue_empty = !reqq_valid AND ibuf_empty AND coalescer_empty. This includes outstanding
    load tags; the internal coalescer is disabled here. It does not prove that a store already handed to downstream
    mem_unit/cache is globally visible. BAR consumes AND of LSU empty. WSYNC separately tests per-warp pending_alm_empty.
    Core busy also includes mem_unit_empty and DCR busy.
- id: r-feedback
  status: FROZEN
  nodes:
  - n-alu
  - n-sfu
  - n-fpu
  - n-schedule
  evidence:
  - integer::result_fire/br_enable/branch_ctl_if
  - wctl::execute_fire/wctl_reg
  - fpu::fpu_rsp_fire/fpu_csr_reg
  statement: Branch feedback is registered after ALU result acceptance with branch and eop qualification. WCTL feedback
    is registered after execute fire/eop. FPU flags write is registered after response fire/eop/has_fflags. These
    are separate from commit arbitration and cannot all be deferred to a single retirement event.
- id: r-flush
  status: FROZEN
  nodes:
  - n-dcr
  - n-iflush
  - n-dflush
  - n-icache
  - n-dcache
  evidence:
  - core::dcr_flush_dcache_if/dcr_flush_icache_if/dcr_flush_if.done
  - mem::VX_dcr_flush
  statement: D-cache flush request follows DCR request; I-cache flush request is gated by D-cache done. Combined
    done is AND of both. VM-disabled wiring bypasses MMUs but retains both flush wrappers.
- id: r-memory-fabric
  status: FROZEN
  nodes:
  - n-icache
  - n-dcache
  - n-memory-fabric
  - n-external-memory
  evidence:
  - socket::g_mem_bus_if.g_i0.mem_arb/g_i
  - cluster::l2cache.PASSTHRU
  - top::l3cache.PASSTHRU
  - cache-wrap::g_bypass
  - cache-bypass::DIRECT_PASSTHRU
  statement: Port zero merges I-cache and D-cache port zero with I-cache priority; other port carries D-cache directly
    with tag adaptation. Disabled L2/L3 retain wrappers, but WORD_SIZE=SECTOR_SIZE=64 and NUM_REQS=MEM_PORTS=2 select
    DIRECT_PASSTHRU; their actual request/response OUT_BUF are zero despite wrapper knobs=3. External response time
    is unspecified.
- id: r-buffer-detail
  status: FROZEN
  nodes:
  - n-schedule
  - n-ibuffer
  - n-dispatch
  evidence:
  - elastic::SIZE branches
  - stream-buffer::valid_in_r/valid_out_r
  - fifo::bypass/pending_size
  - pipe-buffer::ready_in
  statement: SIZE=0 is combinational. SIZE=1 uses pipe_buffer. SIZE=2 uses registered ready/valid stream_buffer
    even with OUT_REG=0. SIZE>2 uses FIFO occupancy; ready_in=!full so a full FIFO cannot accept a new input merely
    because a pop is occurring. Simultaneous accepted push/pop preserves occupancy. FIFO head bypass on empty push
    is registered, not combinational fall-through.
- id: r-scheduler-edge
  status: FROZEN
  nodes:
  - n-schedule
  - n-fetch
  - n-decode
  evidence:
  - schedule::always_comb stalled_warps_n/warp_pcs_n; schedule_fire/schedule_if_fire
  statement: 'Source assignment order: start old state; CTA dispatch; decode unlock; pending wspawn activation;
    TMC; split; join; barrier unlock; WSYNC; branch; internal schedule_fire sets stall; C-disabled schedule_if_fire
    assigns PC from payload+4 last. Later assignments override overlapping fields only. Reset overrides sequential
    state updates. Eligibility uses registered active_warps/stalled_warps, not newly calculated next-state. This
    precedence does not assert all conflicting events are reachable.'
- id: r-scoreboard-edge
  status: FROZEN
  nodes:
  - n-scoreboard
  - n-commit
  - n-dispatch
  evidence:
  - scoreboard::writeback_fire/staging_fire/operands_ready_r/fu_pending
  - pending::ALM_FULL
  statement: WB valid+matching wis+eop releases rd (when wb) and wr_xregs. New staging OUTPUT fire reserves after release; see cc-reserve-release for replacement-input selection.
    Dependency readiness uses resulting inuse next-state and registers operands_ready_r; earliest already-staged
    dependent departure is next edge after WB, if FU credit/lock and arbiter permit. Credit counter increments at
    issue_fire before scoreboard output buffering and decrements at dispatch_if fire. ALM_FULL=DISPATCH_QSIZE-1
    is a guard, not effective queue capacity.
- id: r-opc-detail
  status: FROZEN
  nodes:
  - n-operands
  evidence:
  - opc::req_xbar/has_collision/opd_fetched_st1/pipe_reg1/pipe_reg2/out_buf
  statement: P bank arbitration selects among used nonzero unfetched sources; collisions retain fetched mask and
    hold request acceptance until complete. Two pipe registers align bank address/control and synchronous RAM result;
    assembled operands then enter separate output skid. No timing register bypass is inferred from functional snapshot
    reads.
- id: r-muldiv-detail
  status: FROZEN
  nodes:
  - n-alu
  evidence:
  - muldiv::IMUL_DPI/IDIV_DPI/RV32 multiplier/serial_div
  - serial-div::cntr/busy_r
  - elastic-adapter::loaded
  - define::!SYNTHESIS && SV_DPI -> IMUL_DPI/IDIV_DPI
  statement: RV32 non-IMUL_DPI multiply uses LATENCY_IMUL shifts and per-lane multiplier, stalls all shifts when
    output valid and not ready. Non-IDIV_DPI division starts with cntr=WIDTHN-1 and busy=1; each subsequent busy
    edge iterates through zero then clears busy. Adapter accepts only !loaded, exposes loaded&&!busy, clears loaded
    on response pop. It cannot accept on the same edge that pops an existing result. IDIV_DPI instead uses LATENCY_IMUL
    shift pipeline; it is conditional, not the default serial divider behavior.
- id: r-fpu-std
  status: FROZEN
  nodes:
  - n-fpu
  evidence:
  - fpu-std::NUM_PES_*/pe_ser/rsp_arb
  - serializer::g_passthru/shift_reg/out_buf
  - fpu::tag_store/mdata_full
  statement: Conditional STD RV32 profile with PE ratios=1 has four parallel PEs in each FMA/DIVSQRT/CVT/NCP subcore;
    no lane batching. Metadata shifts LATENCY enabled steps, each serializer has its own OUT_BUF=2, and four subcore
    responses merge with R arbitration and backend OUT_BUF=3. FPU header pool allocation on execute_fire and release
    on fpu_rsp_fire independently limit concurrency. Local II=1 cannot be promoted to sustained whole-FPU II=1.
- id: r-csr-detail
