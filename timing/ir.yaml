  statement: Every CSR request first waits for cta_read_done; execute.ready=csr_req_ready&&cta_read_done, and wait
    resets on execute fire. Source write_enable=csr_req_valid&&csr_wr_enable, without ready qualification; preserve
    this observation; audit-csr-stall implements the corresponding request-window semantics. FCSR next-state ORs FP flags then software writes replace addressed bits.
    Scheduler mscratch assignment order is spawn copy, CTA parameter, software CSR; hardware synchronous trap CSR
    writes follow software trap CSR writes. Dynamic FRM reads old registered fcsr before the update edge.
