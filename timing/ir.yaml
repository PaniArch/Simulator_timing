  statement: WAIT waits for old outgoing transfer and free load metadata, then enters SEND; SEND registers one coalesced
    batch, advances remaining mask, returns input ready only for last batch. Per-batch load metadata allocates on
    req_sent&&!in_req_rw and releases on out_rsp_fire&&out_rsp_eop. Outputs may precede final input handshake for
    a multi-batch request. empty checks WAIT, no outgoing valid and no input valid; it is a store-tail test and
