config:
- id: cfg-baseline
  status: FROZEN
  evidence:
  - bundle::revisions
  - config::platform/isa/pipeline
  - header::VX_CFG_*
  - types-header::RV32
  - core::instances
  - execute::instances
  condition: Bundled XLEN=32 dataset; no configuration-changing overrides. External build identity is u-build.
  bundle_revision: 85a88fe250b0da483cb33ed34126d675ecb93c1c
  vortex_revision: e2b9745b637ce8ac462be2f0e01b5d76542dc6c0
  values:
    xlen_bits: 32
    flen_bits: 32
    address_bits: 32
    clusters: 1
    cores_per_cluster: 1
    socket_size: 1
    sockets_per_cluster: 1
    warps_per_core: 4
    threads_per_warp: 4
    simd_lanes: 4
    issue_width: 1
    operand_collectors_per_issue: 1
    execution_class_indices:
      ALU: 0
      LSU: 1
      SFU: 2
      FPU: 3
    enabled:
    - I
    - M
    - F
    - Zicond
    - ICACHE
    - DCACHE
    - LMEM
    disabled:
    - D
    - C
    - A
    - VM
    - TCU
    - DMA
    - DXA
    - TEX
    - RASTER
    - OM
    - RTU
    - L2
    - L3
  derivation: ISSUE_WIDTH=up(4/16)=1; NUM_OPCS=up(4/(4*1))=1; SIMD_COUNT=1; NUM_EX_UNITS=4. Integer division before
    up.
- id: cfg-memory
  status: FROZEN
  evidence:
  - config::memory/l1cache/lmem
  - header::VX_CFG_DCACHE_WORD_SIZE
  - pkg::DCACHE_CHANNELS/DCACHE_NUM_REQS/LSU_QUEUE_OUT_SIZE
  - socket::icache/dcache
  - mem::g_coalescing
  - types::memmap
  - types-header::VX_MEM_LMEM_BASE_ADDR
  values:
    memory_block_bytes: 64
    lsu_word_bytes: 4
    lsu_line_bytes: 16
    dcache_word_bytes: 8
    dcache_channels: 2
    l1_memory_ports: 2
    local_base_address: '0xffff0000'
    local_size_bytes: 16384
    local_banks: 4
    icache_instances: 1
    dcache_instances: 1
    icache_banks: 1
    dcache_banks: 2
    icache_size_bytes: 16384
    dcache_size_bytes: 16384
    icache_ways: 4
    dcache_ways: 4
    line_and_sector_bytes: 64
    dcache_writeback: 1
    replacement_enum_fifo: 1
    lsu_queue_out_size: 8
  derivation: DCACHE_WORD_SIZE=4*2^((clog2(4)+1)/2)=8; CHANNELS=16/8=2; banks=2; L1 ports=min(2,2); LSU_QUEUE_OUT_SIZE=max(8,16/4)=8.
    Single core and disabled L2/L3 make D-cache write-back LLC.
- id: cfg-fpu-conditional
  status: FROZEN
  evidence:
  - config::fpu/toolchain
  - header::VX_CFG_FPU_TYPE_*/VX_CFG_FMA_LATENCY
  - fpu::backend_ifdefs
  interpretation: Conditional source facts only; do not choose the external build backend from these defaults.
  branches:
  - condition: no backend override and no SYNTHESIS and no SV_DPI
    backend: STD
    fma_parameter_cycles: 8
    fdiv_parameter_cycles: 17
    fsqrt_parameter_cycles: 17
  - condition: no backend override and no SYNTHESIS and SV_DPI
    backend: DPI
    fma_parameter_cycles: 8
    fdiv_parameter_cycles: 15
    fsqrt_parameter_cycles: 10
  - condition: no backend override and SYNTHESIS and ASIC
    backend: STD
  - condition: no backend override and SYNTHESIS and not ASIC
    backend: DSP
    vendor_axes:
    - VIVADO
    - QUARTUS
  - condition: explicit VX_CFG_FPU_TYPE_FPNEW
    backend: FPNEW
  selected_external_backend: null
  unknown_ref: u-build
nodes:
- id: n-schedule
  status: FROZEN
  scope: core
  role: Warp PC/mask/stall, fetch selection and pending accounting
  evidence:
  - schedule::out_buf; wid_select; warp_pcs; ibuf_full; warp_pending; cta_dispatcher
- id: n-fetch
  status: FROZEN
  scope: core
