    signals. No sent-subset mask is stored here. Exactly-once transfer under asymmetric mixed-subset backpressure
    is not established by these equations; see u-mixed-split. Do not silently invent sent bits in the static IR.
- id: r-software-edge
  status: PROVISIONAL
  nodes:
  - n-schedule
  - n-scoreboard
  - n-commit
  evidence:
  - functional::ownership/effect boundary
  - cycle-buffer::Evaluate
  - cycle-edge::CommitEdge
  statement: T9 buffer implementation evaluates combinational equations against old registered state, determines
    handshakes, then validates all detached transitions before committing one common edge. SIZE=0 forwards without
    storage; registered outputs use only old payloads. Duplicate or stale proposals reject the entire edge.
    Flush discards transient contents only and does not roll back architecture or cancel external requests.
    This implementation does not prove all cross-component simultaneous-event reachability; u-feedback remains open.
- id: r-software-clock
  status: PROVISIONAL
  nodes:
  - n-schedule
  - n-commit
  evidence:
  - cycle-clock::Clock.Run/edgeDriver.Handle
  statement: One Akita event drives one common edge. Caller supplies a positive integer-picosecond scale;
    it is not an inferred RTL frequency. Finite budgets preserve monotonically numbered edges across Run calls.
    Callback failure is retained by the driver and prevents further events because the bundled Akita engine
    discards Handler return errors. No architecture state is owned by the clock.
- id: r-software-components
  status: PROVISIONAL
  nodes:
  - n-fetch
  - n-decode
  - n-uop
  - n-scoreboard
  - n-operands
  - n-alu
  - n-fpu
  - n-sfu
  - n-commit
  evidence:
  - cycle-fetch::Fetch.Evaluate
  - cycle-decode::DecodeToken
  - cycle-uop::Sequencer.Evaluate
  - cycle-issue::Issue.Evaluate
  - cycle-operands::Collector.Evaluate
  - cycle-execute::Pipeline/Divider/STDPath
  - cycle-csr::CSR.Evaluate
  - cycle-commit::Commit.Evaluate
  statement: T9 components use detached value tokens and private next-state proposals. Fetch allocates context
    at request-buffer input, retains the I-flush request boundary and rejects responses before external request
    acceptance. Decode uses existing strict ISA Decode and adds no register. Packed sequencing holds ibuffer
    through final uop acceptance. Single-active-warp Issue registers externally supplied eligibility and the
    old FU almost-full predicate; credits span issue through dispatch, not an extra queue. Collector performs
    partial bank passes before final input acceptance, aligns two metadata/RAM stages and separate output skid.
    Multiply and explicitly selected STD paths globally stall their shifts; serial divider retains loaded through
    response waiting. CSR models context wait and exposes unqualified request-valid without applying effects.
    Commit uses P priority, ack-free registered WB and separate registered pending notification. Architectural
    effects and exhaustive feedback remain pending; current composition is recorded by r-software-composition.
- id: r-software-composition
  status: PROVISIONAL
  nodes:
  - n-fetch
  - n-decode
  - n-scoreboard
  - n-operands
  - n-dispatch
  - n-alu
  - n-sfu
  - n-fpu
  - n-commit
  evidence:
  - cycle-core::Core.Evaluate
  - cycle-observe::ResourceState
  - cycle-driver::RunTokens
  - cycle-lsu::LSU.Evaluate
  - cycle-frontend::Frontend.Evaluate
  - cycle-dispatch::Dispatch.Evaluate
  - cycle-merge::Merge.Evaluate
  - cycle-alu::ALU.Evaluate
  - cycle-sfu::SFU.Evaluate
  - cycle-fpu::STDFPU.Evaluate
  - rr-arbiter::g_model1
  - stream-arbiter::g_arbiter grant_ready
  - integer::br_enable/branch_reg
  - wctl::wctl_reg and drain predicates
  - fpu::tag_store/fpu_csr_reg
  statement: Under cfg-baseline full-width non-DPI RV32 integer and explicitly selected STD FPU conditions,
    Frontend connects schedule, Fetch, combinational Decode, ibuffer, sequencer, Issue, Collector and four
    Dispatch queues. Dispatch completion releases Issue credits at FU acceptance. Merge P selects the lowest
    valid input; R begins at input zero after reset and advances past the accepted input only when the merge
    buffer accepts. Arbitration adds no extra stage beyond its named result buffer. ALU connects INT and
    MUL/DIV through their P merge and R PE merge; branch identity notification follows INT result-fire/eop by
    one edge. SFU connects registered lane dispatch, WCTL/CSR, R merge and registered gather; WCTL requires
    externally supplied old-state drain eligibility and notifies one edge after execute-fire/eop. STDFPU
    allocates two header contexts on execute-fire, releases on backend response-fire, and emits FFLAGS identity
    one edge later. Headers alias datapath tokens and add no data capacity; full cannot borrow same-edge release.
    Core connects all four FU outputs through Commit using only old-state proposals. Token-only tests cover
    every execution class and packed bursts; resource snapshots and handshake observations are detached values.
    RunTokens drives one instruction at a time with Akita, waits for all uop pending notifications and complete
    internal/external drain, and reports cycle-budget exhaustion as an error. Its fetch/memory service delays
    are explicit diagnostic inputs, not RTL latency claims. It neither redirects branch targets nor evaluates
    architectural effects. Functional integration, barrier events and complete feedback remain pending.
- id: r-software-lsu
  status: PROVISIONAL
  nodes:
  - n-lsu
  - n-lsu-scheduler
  evidence:
  - cycle-lsu::LSU.Evaluate
  - lsu-slice::fence_lock/no_rsp_buf_enable/execute_if.ready
  - mem-scheduler::req_queue/ibuf_push/ibuf_pop/g_no_coalescer/g_no_batch/rsp_buf
  - core::LSU_SCHED_NUM_CLIENTS conditional and lsu_scheduler
  statement: The implementation selects cfg-baseline single-client full-width scheduler, LINE_SIZE equal to
    WORD_SIZE, CORE_REQS equal to MEM_CHANNELS and no MEM_OUT_BUF/CORE_OUT_BUF. Registered lane dispatch
    feeds the four-entry request queue and eight-entry load context pool with joint admission. Stores require
    request and no-response result space but no load tag; their result may reach WB before external request
    acceptance. Load/last-fence responses must match an already-sent old context, keep partial lane coverage,
    and release the tag only at final response acceptance into the load-result buffer. Load-priority P merge
    and registered gather precede Commit. Non-final fence packets skip memory and use no-response completion;
    a final fence sets fence_lock at request-queue admission and clears it on final fence-response acceptance.
    Old lock still blocks same-edge admission. Drained also requires provider-reported service idle, preserving
    external store tails. The service begins at the scheduler vector port; downstream memory coalescing,
    local/global split, caches and visibility remain external and unresolved rather than assigned zero cycles.
- id: r-software-wait-pool
  status: PROVISIONAL
