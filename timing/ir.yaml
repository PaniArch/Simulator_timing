schema_version: 1
id: timing-baseline
status: PROVISIONAL
scope: Frozen-source structure and T11 single-core Kernel launch, four-warp scheduled execution, CTA synchronization, local reclamation and explicit service/identity boundaries
units:
  capacity: entries at the named scope; not added across aliases
  data_bytes: bytes of data per physical transfer, excluding metadata
  width_bits: bits
  latency_cycles: rising core-clock edges between explicitly named boundaries
  interval_cycles: minimum acceptance interval only under stated conditions
  rtl_parameters: verbatim or evaluated instance parameters, not end-to-end timing
  null: unknown or intentionally unassigned; never zero
sources:
  kernel-acceptance-guide:
    path: timing/kernel-usage.md
    locator: API usage, AC-019 to AC-024 mapping, normal stop audit and explicit precision boundaries
  kernel-spawn-regression:
    path: timing/runner/kernel_spawn_test.go
    locator: operand-selected target subset from CTA owner pool; unowned target rejection
  kernel-event-identity:
    path: timing/runner/kernel_events.go
    locator: once-only Kernel and CTA generation bound external completion tickets
  kernel-event-regression:
    path: timing/runner/kernel_events_test.go
    locator: old completion after slot reuse rejects without changing replacement CTA
  kernel-residency-events:
    path: timing/runner/kernel_observe.go
    locator: TakeEvents; cycle-stamped generation admission reclamation and external completion
  kernel-sync-progress:
    path: timing/task11-kernel-sync.md
    locator: Barrier owner, delivery edge, queued wake and remaining reclamation work
  kernel-barrier-regression:
    path: timing/runner/kernel_barrier_test.go
    locator: repeated two-Warp local exchange with independent CTA barrier phases
  kernel-launch-owner:
    path: timing/runner/kernel.go
    locator: NewKernel and Run; GridWalker to actual MultiRunner with fixed-stride residency
  kernel-launch-regression:
    path: timing/runner/kernel_test.go
    locator: startup entry CSR jump, parameter and block context, physical LMEM address and global output
  independent-residency-memory:
    path: emu/core/residency.go
    locator: explicit physical offsets, atomic admission checks and canonical CTA routes without functional Core
  cta-dispatch-model:
    path: timing/model/cta.go
    locator: WarpQuiescent and DispatchWarp; per-slot pipeline ownership and staged normal activation
  cta-dispatch-runner:
    path: timing/runner/cta.go
    locator: software and external tail gate; canonical initialization and retained unrelated work
  cta-dispatch-regression:
    path: timing/runner/cta_dispatch_test.go
    locator: TestCTADispatchWhileOtherWarpsRun; actual CSR parameter read and partial mask
  kernel-residency-progress:
    path: timing/task11-kernel.md
    locator: implemented per-Warp data service lifetime and remaining Kernel admission work
  cta-memory-regression:
    path: timing/runner/cta_memory_test.go
    locator: TestMultiCTAMemoryRoutesThroughTiming; four isolated resident CTA local routes and global outputs
  cycle-control-progress:
    path: timing/task11-cycle-control.md
    locator: T11 hardware pending and LSU drain implementation; remaining milestone work
  architectural-counter-regression:
    path: timing/runner/counters_test.go
    locator: packed uop commit versus macro receipt; old-edge CSR cycle instret and active mask
  scheduler-priority-regression:
    path: timing/model/feedback_test.go
    locator: detached producer ordering; per-field branch JOIN merge; frontend assignment priority
  csr-joint-delivery:
    path: emu/state/delivery.go
    locator: DeliverCSRWithFlags and DeliverWarpSpawnAtActivation; common owner transaction and receipts
  spawn-wait-regression:
    path: timing/runner/spawn_test.go
    locator: other-warps-active and target-tails; commit before activation and no effect drain
  trap-feedback-regression:
    path: timing/effects/trap_test.go
    locator: feedback-edge CSR reads; prior versus same-edge writes; held CSR; four-producer overlap
  trap-runner-regression:
    path: timing/runner/trap_test.go
    locator: four-warp scheduled ECALL handler and MRET round trip
  hardware-accounting:
    path: timing/model/accounting.go
    locator: instructionAccounting; registered issue and EOP commit; busy-qualified cycles; LSUSchedulerDrained
  generic-arbiter:
