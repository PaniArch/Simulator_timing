  - schedule::per_warp_ctr/busy_buf/cta_warp_done
  - cta::warp_done/cta_done
  - core::busy
  - top::busy
  statement: WB eop is converted into a registered committed mask; scheduler pending decrements and instret increments
    when that mask is consumed. Pending increments from registered issue_sched_if (scoreboard output acceptance);
    almost-empty means <=1, used by WSYNC. Software instructionAccounting implements this registered ledger independently of effect receipts; each packed uop has its own entry. TMC zero mask sends warp_done to dispatcher; CTA final-member completion
    differs from pipeline drain. Scheduler busy includes active next-state, nonempty pending and dispatcher busy;
    Core adds LSU emptiness, mem-unit store tail and DCR busy; top adds KMU/DCR/cluster busy. KMU generation finished
    alone is not execution complete.
